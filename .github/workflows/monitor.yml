name: Puppet Theater Monitor

on:
  schedule:
    # Запуск каждые 15 минут
    - cron: '*/5 * * * *'
  # Позволяет запустить проверку вручную кнопкой во вкладке Actions
  workflow_dispatch:

jobs:
  check-tickets:
    runs-on: ubuntu-latest

    steps:
      - name: Загрузка репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка библиотек
        run: pip install requests beautifulsoup4

      - name: Запуск проверки афиши
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python monitor_puppet.py

      - name: Сохранение списка найденных спектаклей
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add seen_january.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update seen events" && git push)
